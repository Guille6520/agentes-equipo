name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Valores ficticios: CI no usa secretos ni llama a modelos ni a la base de datos real.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      NVIDIA_API_KEY: ci-dummy
      GOOGLE_GENERATIVE_AI_API_KEY: ci-dummy
      DEMO_USER: ci
      DEMO_PASSWORD: ci-dummy
      SESSION_SECRET: ci-dummy-session-secret-not-used-in-production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
